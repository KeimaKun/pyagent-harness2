[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-agent-harness"
version = "0.1.0"
description = "Antigravity-Style Agent Harness with Overwrite State Planner and sqlite-vec Memory"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "pytest>=7.0.0",
    "sqlite-vec>=0.1.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
